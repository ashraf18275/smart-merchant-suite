name: Flutter CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "foundation/**"
    paths:
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - ".github/workflows/flutter-ci.yml"
  pull_request:
    paths:
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - ".github/workflows/flutter-ci.yml"
  workflow_dispatch:

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format application sources
        run: dart format lib/application
      - name: Export formatted sources and dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: resolved-engineering-inputs
          path: |
            lib/application/
            pubspec.lock
          retention-days: 2
      - name: Analyze
        run: flutter analyze
      - name: Run tests
        run: flutter test
