name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/**"

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android .

      - name: Set Android compile SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          candidates = [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]
          found = False
          for path in candidates:
              if not path.exists():
                  continue
              text = path.read_text()
              updated = text.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
              updated = updated.replace("compileSdkVersion flutter.compileSdkVersion", "compileSdkVersion 36")
              if updated != text:
                  path.write_text(updated)
                  found = True
          if not found:
              raise SystemExit("Could not find the generated Android compileSdk setting.")
          PY

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-merchant-suite-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
