name: Supabase Edge Function Check

on:
  push:
    branches:
      - "feature/**"
    paths:
      - "backend/supabase/functions/**"
      - ".github/workflows/supabase-ci.yml"
  pull_request:
    paths:
      - "backend/supabase/functions/**"
      - ".github/workflows/supabase-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-edge-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check invitation function
        run: deno check backend/supabase/functions/invite-member/index.ts
